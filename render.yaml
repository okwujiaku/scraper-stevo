# Render Blueprint — Stevo Background Worker
# Set USER_TOKEN in the Render dashboard (Environment), not here.
services:
  - type: worker
    name: stevo-join-tracker
    runtime: python
    plan: starter
    rootDir: bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CHAT_ID
        value: "1511486061941882930"
      - key: CLIENT_NAME
        value: Stevo
      - key: DISPLAY_TIMEZONE
        value: Africa/Lagos
      - key: USER_TOKEN
        sync: false
